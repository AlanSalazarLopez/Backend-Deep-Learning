# Mantiene despierto el servicio de Render (gratis se duerme a los ~15 min sin tráfico).
# Configura el secreto HEALTH_URL en GitHub: Settings > Secrets and variables > Actions
# con el valor https://tu-servicio.onrender.com/health
name: keepalive
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping /health
        run: curl -fsS --retry 2 --retry-delay 10 --max-time 90 "${{ secrets.HEALTH_URL }}"
